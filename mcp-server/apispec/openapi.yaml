info:
  description: Allowlisted subset of the Renku Data Services API exposed through the
    Renku MCP server.
  title: Renku Data Services API (MCP subset)
  version: feat-upgrade-openapi-spec-3.1
openapi: 3.1.0
paths:
  /data_connectors:
    get:
      description: List data connectors (connections to external storage such as S3
        buckets or WebDAV shares) the user can access. Use `namespace` to restrict
        the list to a user or group namespace. Returns data connector IDs usable with
        get_data_connector.
      operationId: list_data_connectors
      parameters:
      - description: A namespace, used as a filter.
        in: query
        name: namespace
        required: false
        schema:
          default: ""
          type: string
      - description: Result's page number starting from 1
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The number of results per page
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        default:
          description: The response of the Renku API.
  /data_connectors/{data_connector_id}:
    get:
      description: Get a data connector by its ID, including its storage configuration
        and mount point.
      operationId: get_data_connector
      parameters:
      - description: the ID of the data connector
        in: path
        name: data_connector_id
        required: true
        schema:
          description: ULID identifier
          maxLength: 26
          minLength: 26
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          type: string
      responses:
        default:
          description: The response of the Renku API.
  /groups:
    get:
      description: List Renku groups. Returns group slugs usable with get_group and
        as the `namespace` filter of list_projects and list_data_connectors.
      operationId: list_groups
      parameters:
      - description: the current page in paginated response
        explode: true
        in: query
        name: page
        schema:
          default: 1
          description: Result's page number starting from 1
          minimum: 1
          type: integer
        style: form
      - description: the number of results per page in a paginated response
        explode: true
        in: query
        name: per_page
        schema:
          default: 20
          description: The number of results per page
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: A flag to filter for where the user is a direct member.
        explode: true
        in: query
        name: direct_member
        schema:
          default: false
          type: boolean
        style: form
      responses:
        default:
          description: The response of the Renku API.
  /groups/{group_slug}:
    get:
      description: Get a Renku group by its slug.
      operationId: get_group
      parameters:
      - in: path
        name: group_slug
        required: true
        schema:
          description: A command-line/url friendly name for a namespace
          examples:
          - a-slug-example
          maxLength: 99
          minLength: 1
          type: string
      responses:
        default:
          description: The response of the Renku API.
  /namespaces/{namespace}/projects/{slug}:
    get:
      description: Get a Renku project by its namespace and slug, e.g. namespace "my-group"
        and slug "my-project" for the project at /p/my-group/my-project. Use this
        when the user refers to a project by name or URL. Returns the project ID needed
        by other tools.
      operationId: get_project_by_slug
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: slug
        required: true
        schema:
          type: string
      - in: query
        name: with_documentation
        schema:
          description: Projects with or without possibly extensive documentation?
          type: boolean
      responses:
        default:
          description: The response of the Renku API.
  /projects:
    get:
      description: List Renku projects the user can access, newest first. Use `namespace`
        to restrict the list to a user or group namespace and `direct_member` to only
        list projects the user is a member of. Returns project IDs usable with get_project,
        list_project_session_launchers and list_project_data_connector_links.
      operationId: list_projects
      parameters:
      - description: A flag to filter projects where the user is a direct member.
        in: query
        name: direct_member
        required: false
        schema:
          default: false
          type: boolean
      - description: A namespace, used as a filter.
        in: query
        name: namespace
        required: false
        schema:
          default: ""
          type: string
      - description: Result's page number starting from 1
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The number of results per page
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      responses:
        default:
          description: The response of the Renku API.
  /projects/{project_id}:
    get:
      description: Get a Renku project by its ID (a ULID such as 01HXXXXXXXXXXXXXXXXXXXXXXX).
      operationId: get_project
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          description: ULID identifier
          maxLength: 26
          minLength: 26
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          type: string
      - in: query
        name: with_documentation
        schema:
          description: Projects with or without possibly extensive documentation?
          type: boolean
      responses:
        default:
          description: The response of the Renku API.
  /projects/{project_id}/data_connector_links:
    get:
      description: List the data connectors linked to a project. Each link contains
        the data connector ID, usable with get_data_connector.
      operationId: list_project_data_connector_links
      parameters:
      - description: the ID of the project
        in: path
        name: project_id
        required: true
        schema:
          description: ULID identifier
          maxLength: 26
          minLength: 26
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          type: string
      responses:
        default:
          description: The response of the Renku API.
  /projects/{project_id}/session_launchers:
    get:
      description: List the session launchers of a project. A session launcher defines
        the environment (image) a session runs. Returns launcher IDs needed by start_session.
      operationId: list_project_session_launchers
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          description: ULID identifier
          maxLength: 26
          minLength: 26
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          type: string
      responses:
        default:
          description: The response of the Renku API.
  /search/query:
    get:
      description: Full-text search across Renku projects, groups, users and data
        connectors visible to the user. The query supports filters such as `type:project`,
        `type:group`, `type:dataconnector`, `namespace:<slug>`, `visibility:public`
        and `role:owner`, combined with free text, e.g. `type:project climate`. Results
        contain IDs usable with get_project, get_group and get_data_connector.
      operationId: search
      parameters:
      - description: Include counts (project_count, data_connector_count) in the results.
        in: query
        name: include_counts
        required: false
        schema:
          default: false
          type: boolean
      - description: Result's page number starting from 1
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The number of results per page
        in: query
        name: per_page
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: The search query, free text optionally combined with filters
          such as `type:project`.
        in: query
        name: q
        required: false
        schema:
          default: ""
          type: string
      responses:
        default:
          description: The response of the Renku API.
  /session_launchers/{launcher_id}:
    get:
      description: Get a session launcher by its ID, including its environment and
        default resource class.
      operationId: get_session_launcher
      parameters:
      - in: path
        name: launcher_id
        required: true
        schema:
          description: ULID identifier
          maxLength: 26
          minLength: 26
          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          type: string
      responses:
        default:
          description: The response of the Renku API.
  /sessions:
    get:
      description: List the user's running and hibernated sessions. Returns session
        names usable with get_session, get_session_logs and stop_session.
      operationId: list_sessions
      parameters:
      - description: Filter by session mode.
        in: query
        name: session_type
        schema:
          enum:
          - interactive
          - non-interactive
          type: string
      responses:
        default:
          description: The response of the Renku API.
    post:
      description: Start a session from a session launcher, or return the existing
        one if a session for that launcher is already running. Usually only `launcher_id`
        is needed; get it from list_project_session_launchers. The response contains
        the session name and its URL, which the user can open in a browser once the
        status is `running`. Starting can take a few minutes; poll with get_session.
      operationId: start_session
      requestBody:
        content:
          application/json:
            schema:
              properties:
                data_connectors_overrides:
                  items:
                    properties:
                      configuration:
                        additionalProperties:
                          oneOf:
                          - type: integer
                          - type:
                            - string
                            - "null"
                          - type: boolean
                          - type: object
                        description: Dictionary of rclone key:value pairs (based on
                          schema from '/storage_schema')
                        type: object
                      data_connector_id:
                        allOf:
                        - description: ULID identifier
                          maxLength: 26
                          minLength: 26
                          pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                          type: string
                        - description: |
                            The `data_connector_id` must match an existing data connector from the session launcher's project.
                      readonly:
                        default: true
                        description: Whether this storage should be mounted readonly
                          or not
                        type: boolean
                      skip:
                        default: false
                        description: The corresponding data connector will not be
                          mounted if `skip` is set to `true`.
                        type: boolean
                      source_path:
                        description: the source path to mount, usually starts with
                          bucket/container name
                        examples:
                        - bucket/my/storage/folder/
                        type: string
                      target_path:
                        description: the target path relative to the working directory
                          where the storage should be mounted
                        examples:
                        - my/project/folder
                        type: string
                    required:
                    - data_connector_id
                    type: object
                  type: array
                disk_storage:
                  description: The size of disk storage for the session, in gigabytes
                  type: integer
                env_variable_overrides:
                  description: Environment variable overrides for the session pod
                  items:
                    description: Override an env variable defined in the session launcher
                    properties:
                      name:
                        examples:
                        - MY_VAR
                        maxLength: 256
                        pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                        type: string
                      value:
                        maxLength: 500
                        type: string
                    required:
                    - name
                    - value
                    type: object
                  type: array
                job_args_override:
                  items:
                    type: string
                  type:
                  - array
                  - "null"
                job_command_override:
                  items:
                    type: string
                  type:
                  - array
                  - "null"
                launcher_id:
                  description: ULID identifier
                  maxLength: 26
                  minLength: 26
                  pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
                  type: string
                resource_class_id:
                  type:
                  - integer
                  - "null"
                submission_id:
                  description: |
                    When submitting a job, i.e. the launcher used is a job
                    launcher, the submission id is required to deduplicate
                    same job submissions and allows retries.
                  pattern: ^[a-z][-0-9a-z]{3,19}$
                  type: string
              required:
              - launcher_id
              type: object
        required: true
      responses:
        default:
          description: The response of the Renku API.
  /sessions/{session_id}:
    delete:
      description: Stop and fully remove a session. Unsaved work in the session is
        lost, so confirm with the user before calling this.
      operationId: stop_session
      parameters:
      - description: The session name, as returned by start_session or list_sessions.
        in: path
        name: session_id
        required: true
        schema:
          type: string
      responses:
        default:
          description: The response of the Renku API.
    get:
      description: Get a session by its name, including its status and URL. Use it
        to wait for a started session to become `running`.
      operationId: get_session
      parameters:
      - description: The session name, as returned by start_session or list_sessions.
        in: path
        name: session_id
        required: true
        schema:
          type: string
      responses:
        default:
          description: The response of the Renku API.
  /sessions/{session_id}/logs:
    get:
      description: Get the most recent log lines of each container of a session. Useful
        to find out why a session failed to start.
      operationId: get_session_logs
      parameters:
      - description: The session name, as returned by start_session or list_sessions.
        in: path
        name: session_id
        required: true
        schema:
          type: string
      - description: The maximum number of most-recent lines to return for each container
        in: query
        name: max_lines
        schema:
          default: 250
          type: integer
      responses:
        default:
          description: The response of the Renku API.
  /user:
    get:
      description: Get the Renku user that is logged in, including their user ID and
        username. The username is also the user's personal namespace, usable as the
        `namespace` filter of list_projects and list_data_connectors.
      operationId: get_current_user
      responses:
        default:
          description: The response of the Renku API.
servers:
- url: /api/data
