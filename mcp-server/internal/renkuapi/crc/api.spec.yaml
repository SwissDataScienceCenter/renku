---
openapi: 3.0.2
info:
  title: Renku Data Services API
  description: |
    This service is the main backend for Renku. It provides information about users, projects,
    cloud storage, access to compute resources and many other things.
  version: v1
servers:
  - url: /api/data
paths:
  /classes/{class_id}:
    get:
      summary: Get a specific resource class
      parameters:
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The resource class that was requested
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceClassWithId"
        "404":
          description: The resource class does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
  /clusters:
    get:
      summary: Get all the cluster configurations
      responses:
        "200":
          description: The cluster configurations
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ClustersWithId"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - clusters
    post:
      summary: Create a new cluster configuration
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/Cluster"
      responses:
        "201":
          description: The cluster configuration was created
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ClusterWithId"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - clusters
  /clusters/{cluster_id}:
    get:
      summary: Get a cluster configuration
      parameters:
        - in: path
          name: cluster_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: The cluster configuration
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ClusterWithId"
        "404":
          description: The cluster configuration does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - clusters
    put:
      summary: Update an existing cluster configuration
      parameters:
        - in: path
          name: cluster_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/Cluster"
      responses:
        "200":
          description: The cluster configuration
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ClusterWithId"
        "404":
          description: The cluster configuration does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - clusters
    patch:
      summary: Update specific fields of an existing cluster configuration
      parameters:
        - in: path
          name: cluster_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ClusterPatch"
      responses:
        "200":
          description: The cluster configuration
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ClusterWithId"
        "404":
          description: The cluster configuration does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - clusters
    delete:
      summary: Remove a cluster configuration
      parameters:
        - in: path
          name: cluster_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "204":
          description: The cluster configuration was removed or did not exist in the first place
        default:
          $ref: "#/components/responses/Error"
      tags:
        - clusters
  /error:
    get:
      summary: Get a sample error response with status code 422
      responses:
        "422":
          description: The error
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /resource_flavors:
    get:
      summary: Get all resource flavors
      parameters:
        - in: query
          description: Filter for resource flavors based on the provided name as a prefix. Omitting this parameter returns all flavors.
          name: resource_flavor_params
          style: form
          explode: true
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                $ref: "#/components/schemas/Name"
      responses:
        "200":
          description: The list of resource flavors
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceFlavorsList"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_flavors
    post:
      summary: Create a new resource flavor
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourceFlavorPost"
      responses:
        "201":
          description: The resource flavor was created
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceFlavor"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_flavors
  /resource_flavors/{resource_flavor_id}:
    get:
      summary: Get a specific resource flavor
      parameters:
        - in: path
          name: resource_flavor_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: The resource flavor that was requested
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceFlavor"
        "404":
          description: The resource flavor does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_flavors
    patch:
      summary: Partially update a resource flavor
      description: |
        The new values take effect on every linked resource class when it is read. They are not
        copied onto the linked classes.
      parameters:
        - in: path
          name: resource_flavor_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourceFlavorPatch"
      responses:
        "200":
          description: The updated resource flavor
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceFlavor"
        "404":
          description: The resource flavor does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_flavors
    delete:
      summary: Remove a resource flavor
      description: Refused while any resource class is still linked to the flavor.
      parameters:
        - in: path
          name: resource_flavor_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "204":
          description: The resource flavor was removed or does not exist
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_flavors
  /resource_flavors/{resource_flavor_id}/resource_classes:
    get:
      summary: Get the resource classes linked to a resource flavor
      description: |
        Shows what an edit to the flavor will affect. A class is listed for as long as it is
        linked, whether or not its own values still match the flavor.
      parameters:
        - in: path
          name: resource_flavor_id
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: The resource classes linked to the resource flavor
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/LinkedResourceClassesList"
        "404":
          description: The resource flavor does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_flavors
  /resource_pools:
    get:
      summary: Get all resource pool definitions
      parameters:
        - in: query
          description: query parameters
          name: resource_pools_params
          style: form
          explode: true
          schema:
            type: object
            additionalProperties: false
            properties:
              cpu:
                allOf:
                  - $ref: "#/components/schemas/CpuFilter"
                default: 0.0
              gpu:
                allOf:
                  - $ref: "#/components/schemas/Gpu"
                default: 0
              memory:
                allOf:
                  - $ref: "#/components/schemas/MemoryFilter"
                default: 0
              max_storage:
                allOf:
                  - $ref: "#/components/schemas/StorageFilter"
                default: 0
      responses:
        "200":
          description: The resource pool definitions
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolsWithIdFiltered"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    post:
      summary: Create a new resource pool
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourcePool"
      responses:
        "201":
          description: The resource pool was created
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolWithId"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
  /resource_pools/{resource_pool_id}:
    get:
      summary: Get a resource pool definition
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: The resource pool definition
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    put:
      summary: Update an existing resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourcePoolPut"
      responses:
        "200":
          description: The resource pool definition
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    patch:
      summary: Update specific fields of an existing resource pool
      description: |
        Note that the quota cannot be removed using the PATCH method.
        To remove the quota, use the PUT method and unset the quota field.
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourcePoolPatch"
      responses:
        "200":
          description: The resource pool definition
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    delete:
      summary: Remove a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "204":
          description: The resource pool was removed or did not exist in the first place
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
  /resource_pools/{resource_pool_id}/classes:
    get:
      summary: Get all resource classes in a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: query
          description: Filter for resource classes based on the provided name as a prefix. Omitting this parameter returns all classes.
          name: resource_class_params
          style: form
          explode: true
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                $ref: "#/components/schemas/Name"
      responses:
        "200":
          description: The resource class in the specific pool
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceClassesWithIdResponse"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
    post:
      summary: Create a new resource class in the specific pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourceClass"
      responses:
        "201":
          description: Created a class in the resource pool
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceClassWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
  /resource_pools/{resource_pool_id}/classes/{class_id}:
    get:
      summary: Get a specific resource class in a specific resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The resource class that was requested
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceClassWithId"
        "404":
          description: The resource class does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
    put:
      summary: Update an existing resource class for a specific resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourceClass"
      responses:
        "200":
          description: Updated the classes in the resource pool
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceClassWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
    patch:
      summary: Partially update an existing resource class for a specific resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ResourceClassPatch"
      responses:
        "200":
          description: Updated the classes in the resource pool
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourceClassWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
    delete:
      summary: Remove the specific resource class
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The resource class was removed or did not exist in the first place
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
  /resource_pools/{resource_pool_id}/classes/{class_id}/tolerations:
    get:
      summary: Get the tolerations from a resource class
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All the tolerations for a resource class
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/K8sLabelList"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
    delete:
      summary: Remove all tolerations from a resource class
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The tolerations have been removed
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
  /resource_pools/{resource_pool_id}/classes/{class_id}/node_affinities:
    get:
      summary: Get the node affinities from a resource class
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: All the affinities for a resource class
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/NodeAffinityListResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
    delete:
      summary: Remove all node affinities from a resource class
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: class_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The node affinities have been removed
        default:
          $ref: "#/components/responses/Error"
      tags:
        - classes
  /resource_pools/{resource_pool_id}/users:
    get:
      summary: Get all users that have access to a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: The list of users
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolUsersWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    post:
      summary: Add users to the list of users that have access to the resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        description: List of user Ids
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PoolUsersWithId"
            example:
              - id: 543-user-id
              - id: 123-some-user
      responses:
        "201":
          description: The list of users was updated
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolUsersWithId"
              example:
                - id: 123-user-id
                - id: user-id
                - id: 456-user-id
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    put:
      summary: Set the list of users that has access to the resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        description: List of user Ids
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PoolUsersWithId"
      responses:
        "200":
          description: The list of users was updated
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolUsersWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
  /resource_pools/{resource_pool_id}/users/{user_id}:
    get:
      summary: Check if a specific user belongs to a specific resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The user belongs to the resource pool
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolUserWithId"
        "404":
          description: The user does not belong to the resource pool, or the resource pool or user do not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    delete:
      summary: Remove a specific user from a specific resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The user was removed, or it was not part of the pool
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
  /resource_pools/{resource_pool_id}/members:
    get:
      summary: Get all members of a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: The list of members
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolMembersResponse"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    post:
      summary: Add members to a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        description: List of members
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PoolMembers"
      responses:
        "201":
          description: The members were added
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolMembersResponse"
        "404":
          description: The resource pool or a member does not exist
          content:
            "application/json":
