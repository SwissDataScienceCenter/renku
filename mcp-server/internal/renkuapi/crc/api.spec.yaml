                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    put:
      summary: Set the members of a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        description: List of members
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PoolMembers"
      responses:
        "200":
          description: The members were set
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolMembersResponse"
        "404":
          description: The resource pool or a member does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
  /resource_pools/{resource_pool_id}/members/{member_type}/{member_id}:
    get:
      summary: Check if a specific member belongs to a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: member_type
          required: true
          schema:
            type: string
            enum: [user, group, project]
        - in: path
          name: member_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The member belongs to the resource pool
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PoolMemberResponse"
        "404":
          description: The member does not belong to the resource pool, or the resource pool or member do not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
    delete:
      summary: Remove a specific member from a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
        - in: path
          name: member_type
          required: true
          schema:
            type: string
            enum: [user, group, project]
        - in: path
          name: member_id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The member was removed or it was not part of the pool
        default:
          $ref: "#/components/responses/Error"
      tags:
        - resource_pools
  /resource_pools/{resource_pool_id}/quota:
    get:
      summary: Get the quota associated with the resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      responses:
        "200":
          description: The resource quota for the resource pool
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/QuotaWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - quota
    put:
      summary: Set the quota associated with the resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/QuotaWithId"
      responses:
        "200":
          description: The quota has been updated
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/QuotaWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - quota
    patch:
      summary: Partially update the quota for a resource pool
      parameters:
        - in: path
          name: resource_pool_id
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/QuotaPatch"
      responses:
        "200":
          description: The quota has been updated
