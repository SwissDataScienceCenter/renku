    ResourcePoolsWithId:
      type: array
      items:
        $ref: "#/components/schemas/ResourcePoolWithId"
    ResourcePoolsWithIdFiltered:
      type: array
      items:
        $ref: "#/components/schemas/ResourcePoolWithIdFiltered"
    PoolUserWithId:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/UserId"
