          $ref: "#/components/schemas/Ulid"
        role:
          type: string
          enum: [project_viewer]
        namespace:
          type: string
          description: Full project namespace path (e.g. user/project)
        name:
          type: string
      example:
        member_type: project
        id: "01ARZ3NDEKTSV4RRFFQ69G5FAW"
        role: project_viewer
        namespace: "user.doe/my-project"
        name: "My Project"
    PoolMemberResponse:
      oneOf:
        - $ref: "#/components/schemas/PoolMemberUserResponse"
        - $ref: "#/components/schemas/PoolMemberGroupResponse"
        - $ref: "#/components/schemas/PoolMemberProjectResponse"
      discriminator:
        propertyName: member_type
        mapping:
          user: "#/components/schemas/PoolMemberUserResponse"
          group: "#/components/schemas/PoolMemberGroupResponse"
          project: "#/components/schemas/PoolMemberProjectResponse"
    PoolMembersResponse:
      type: array
      items:
        $ref: "#/components/schemas/PoolMemberResponse"
      uniqueItems: true
    QuotaPatch:
      type: object
      additionalProperties: false
      properties:
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
      example:
        gpu: 0
        cpu: 100
    QuotaWithId:
      type: object
      additionalProperties: false
      properties:
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        id:
          $ref: "#/components/schemas/Name"
      example:
        gpu: 0
        cpu: 100
        memory: 1000
        id: 518c7d27-b5db-4aee-855f-f4638aded2d4
      required: ["cpu", "memory", "gpu", "id"]
    QuotaWithOptionalId:
      type: object
      additionalProperties: false
      properties:
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        id:
          $ref: "#/components/schemas/Name"
      example:
        gpu: 0
        cpu: 100
        memory: 1000
        id: 518c7d27-b5db-4aee-855f-f4638aded2d4
      required: ["cpu", "memory", "gpu"]
    Version:
      type: object
      properties:
        version:
          type: string
      required: ["version"]
    Cpu:
      type: number
      format: float
      description: Number of cpu cores
      example: 10
      exclusiveMinimum: true
      minimum: 0
    CpuFilter:
      type: number
      format: float
      description: Number of cpu cores
      example: 10
      minimum: 0
    Memory:
      type: integer
      description: Number of gigabytes of memory
      example: 4
      exclusiveMinimum: true
      minimum: 0
      # Max value for int64 in postgres
      maximum: 9223372036854775807
    MemoryFilter:
      type: integer
      description: Number of gigabytes of memory
      example: 4
      minimum: 0
      # Max value for int64 in postgres
      maximum: 9223372036854775807
    Gpu:
      type: integer
      description: Number of GPUs
      example: 8
      minimum: 0
      # Max value for int64 in postgres
      maximum: 9223372036854775807
    UsageHoursRemaining:
      type: number
      format: double
      description: Number of resource hours remaining for the user
      example: 3.141
      minimum: 0
    UsageHoursTotal:
      type: number
      format: double
      description: Total number of resource hours available to the user
      example: 10
      minimum: 0
      default: null
    CreditsUsed:
      type: integer
      description: Amount of the resource credits used so far
      example: 300
      minimum: 0
    Storage:
      type: integer
      description: Number of gigabytes of storage
      example: 100
      exclusiveMinimum: true
      minimum: 0
      # Max value for int64 in postgres
      maximum: 9223372036854775807
    StorageFilter:
      type: integer
      description: Number of gigabytes of storage
      example: 100
      minimum: 0
      # Max value for int64 in postgres
      maximum: 9223372036854775807
    UserId:
      type: string
      description: Keycloak user ID
      example: f74a228b-1790-4276-af5f-25c2424e9b0c
      pattern: "^[A-Za-z0-9]{1}[A-Za-z0-9-]+$"
    IntegerId:
      type: integer
      description: An integer ID used to identify different resources
      minimum: 0
      example: 1
    IntegerIds:
      type: array
      items:
        $ref: "#/components/schemas/IntegerId"
      minItems: 1
      uniqueItems: true
      example: [1, 3, 5]
    Name:
      type: string
      description: A name for a specific resource
      minLength: 5
      example: "the name of a resource"
    ResourceFlavorName:
      type: string
      description: A name for a resource flavor
      minLength: 5
      maxLength: 40
      example: "standard"
    ResourceFlavorDescription:
      type: string
      description: Why a resource flavor is sized the way it is
      maxLength: 500
      example: "Fits a standard node with room for the daemonset"
    ResourceFlavorId:
      description: The resource flavor this resource class is linked to
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    ResourceFlavorIdPatch:
      description: The resource flavor to link this resource class to. An empty string unlinks the class from its resource flavor, and the class keeps its current values.
      type: string
      minLength: 0
      maxLength: 26
      pattern: "^([0-7][0-9A-HJKMNP-TV-Z]{25})?$"
    ConfigName:
      type: string
      description: |
        The name of the Kubernetes configuration to use to connect to the remote cluster. This is currently used to find a file named `<KubeConfigRoot>/<config_name>`.

        This configuration is expected to have a default namespace defined. It will be used for all remote operations requiring a namespace, as well for namespaced objects.
      pattern: "^[a-zA-Z0-9._-]+[.]yaml$"
      example: "a-remote-cluster.yaml"
    DefaultFlag:
      type: boolean
      description: A default selection for resource classes or resource pools
      example: false
    QuotaEnforced:
      type: boolean
      description: Whether sessions in this resource class should be hibernated when quota is exhausted
      example: true
    Preemptible:
      type: boolean
      description: Whether sessions and jobs in this resource class can be preempted by other workloads. The resource pool must have a quota
      example: false
    PublicFlag:
      type: boolean
      description: A resource pool whose classes can be accessed by anyone
      example: false
    RemoteConfiguration:
      type: object
      description: |
        The configuration used by Renku to start sessions remotely.
        If this field is present, the corresponding resource pool starts remote sessions.
      # NOTE: Using oneOf here allows to describe more types of remote sessions
      oneOf:
        - $ref: "#/components/schemas/RemoteConfigurationFirecrest"
        - $ref: "#/components/schemas/RemoteConfigurationRunai"
    RemoteConfigurationFirecrest:
      type: object
      description: |
        The configuration for starting sessions remotely using
        the FirecREST API
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: ["firecrest"]
          description: Kind of remote resource pool
          example: "firecrest"
        provider_id:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestProviderId"
        api_url:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestApiUrl"
        system_name:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestSystemName"
        partition:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestPartition"
      required:
        - kind
        - api_url
        - system_name
    RemoteClassConfigurationFirecrest:
      type: object
      additionalProperties: false
      properties:
        system_name:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestSystemName"
        partition:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestPartition"
        forward_resource_values:
          type: boolean
          default: false
          description: >
            When true, Amalthea forwards the resource class CPU, memory, and GPU values to FirecREST.
            When false (the default), the HPC grid selects the resources; the class values are still
            used for display and quota matching.
    RemoteConfigurationFirecrestProviderId:
      type: string
      description: |
        The ID of a provider (see oauth2 section).
        This is used to allow seamless authentication using Renku integrations.
      example: "my-provider"
    RemoteConfigurationFirecrestApiUrl:
      type: string
      description: The base URL of the FirecREST API
      example: "https://api.cscs.ch/hpc/firecrest/v2"
    RemoteConfigurationFirecrestSystemName:
      type: string
      description: The name of the system to use with the FirecREST API
      example: "eiger"
    RemoteConfigurationFirecrestPartition:
      type: string
      description: The partition to use when submitting jobs
      example: "normal"
    RemoteConfigurationRunai:
      type: object
      description: |
        The configuration for starting sessions remotely using Runai
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: ["runai"]
          description: Kind of remote resource pool
          example: "runai"
        base_url:
          $ref: "#/components/schemas/RemoteConfigurationRunaiApiUrl"
        provider_id:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestProviderId"
      required:
        - kind
        - base_url
    RemoteConfigurationRunaiApiUrl:
      type: string
      description: The base URL of the Runai server
      example: "https://sdsc.run.ai"
    RemoteConfigurationPatch:
      type: object
      description: |
        Patch for the configuration used by to start sessions remotely
      oneOf:
        - $ref: "#/components/schemas/RemoteConfigurationPatchReset"
        - $ref: "#/components/schemas/RemoteConfigurationFirecrestPatch"
        - $ref: "#/components/schemas/RemoteConfigurationRunaiPatch"
    RemoteConfigurationPatchReset:
      type: object
      description: Value used to unset the remote field (empty object).
      additionalProperties: false
    RemoteConfigurationFirecrestPatch:
      type: object
      description: |
        The configuration for starting sessions remotely using
        the FirecREST API
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: ["firecrest"]
          description: Kind of remote resource pool
          example: "firecrest"
        provider_id:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestProviderId"
        api_url:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestApiUrl"
        system_name:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestSystemName"
        partition:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestPartition"
    RemoteConfigurationRunaiPatch:
      type: object
      description: |
        The configuration for starting sessions remotely using Runai
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: ["runai"]
          description: Kind of remote resource pool
          example: "runai"
        base_url:
          $ref: "#/components/schemas/RemoteConfigurationRunaiApiUrl"
        provider_id:
          $ref: "#/components/schemas/RemoteConfigurationFirecrestProviderId"
    IdleThreshold:
      type: integer
      description: A threshold in seconds after which a session gets hibernated (0 means no threshold)
      minimum: 0
      maximum: 2147483647
    HibernationThreshold:
      type: integer
      description: A threshold in seconds after which a session gets culled/deleted (0 means no threshold)
      minimum: 0
      maximum: 2147483647
    HibernationWarningPeriod:
      type: integer
      description: |
        A duration in seconds, lower than `HibernationThreshold`,
        which indicates when to let the user know about a session that
        is going to be hibernated. If `0` is specified, some default
        value will be chosen. If no `HibernationThreshold` is defined,
        this value is ignored.
      minimum: 0
      maximum: 2147483647
    K8sLabelList:
      type: array
      description: A list of k8s labels used for tolerations
      items:
        $ref: "#/components/schemas/K8sLabel"
      example: ["test-label-1"]
      uniqueItems: true
      default: []
      minItems: 0
    K8sLabel:
      type: string
      description: A valid K8s label
      example: some-label-1
      pattern: "^[a-z0-9A-Z][a-z0-9A-Z-_./]*[a-z0-9A-Z]$"
      minLength: 3
      maxLength: 63
    K8sResourceName:
      type: string
      description: |
        A name of any K8s resource (i.e. Pod, Service, Secret, etc.).
        This is pattern imposes the stricter rules applied to some resource type names
        that need to follow DNS label standard and therefore can be used for all types.
        Looser rules can be applied to a smaller subset of resource types.
      example: some-k8s-resource
      pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
      minLength: 1
      maxLength: 63
    K8sResourceNamePatch:
      type: string
      description: |
        A name of any K8s resource (i.e. Pod, Service, Secret, etc.).
        This is pattern imposes the stricter rules applied to some resource type names
        that need to follow DNS label standard and therefore can be used for all types.
        Looser rules can be applied to a smaller subset of resource types. An empty
        string indicates that the value should be removed if present in the DB.
      example: some-k8s-resource
      pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
      minLength: 0
      maxLength: 63
    NodeAffinity:
      type: object
      additionalProperties: false
      description: A minimal representation of a node affinity label
      properties:
        key:
          $ref: "#/components/schemas/K8sLabel"
        required_during_scheduling:
          type: boolean
          default: false
      required: ["key"]
      example:
        key: some-label-32
        required_during_scheduling: true
    NodeAffinityListResponse:
      type: array
      description: A list of k8s labels used for tolerations and/or node affinity
      items:
        $ref: "#/components/schemas/NodeAffinity"
      example: [{ "key": "test-label-1", "required_during_scheduling": false }]
      uniqueItems: true
      default: []
      minItems: 0
    NodeAffinityList:
      type: array
      description: A list of k8s labels used for tolerations and/or node affinity
      items:
        $ref: "#/components/schemas/NodeAffinity"
      example: [{ "key": "test-label-1", "required_during_scheduling": false }]
      uniqueItems: true
      default: []
      minItems: 0
    RuntimePlatform:
      type: string
      description: |
        A runtime platform, e.g. "linux/amd64" or "linux/arm64".
      enum: ["linux/amd64", "linux/arm64"]
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: integer
              minimum: 0
              exclusiveMinimum: true
              example: 1404
            detail:
              type: string
              example: "A more detailed optional message showing what the problem was"
            message:
              type: string
              example: "Something went wrong - please try again later"
            trace_id:
              type: string
              example: "ac93950e9e114a55c67fb8e5ef519bbe"
              description: Sentry trace ID for linking to corresponding log entries
          required: ["code", "message"]
      required: ["error"]
    Ulid:
      description: ULID identifier
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" # This is case-insensitive
    Protocol:
      description: Allowed Protocol strings
      type: string
      enum: ["http", "https"]
    Port:
      type: integer
      minimum: 0
      maximum: 65536
    Host:
      type: string
      maxLength: 256
      # The following pattern accept things it should not, but this is better than no validation at all.
      pattern: "^([0-9a-zA-Z:_-]+[.])*[0-9a-zA-Z:_-]+$"
    TlsSecretName:
      type: string
      maxLength: 256
    StorageClassName:
      type: string
      maxLength: 256
    IngressClassName:
      type: string
      maxLength: 256
    IngressAnnotations:
      type: object
      additionalProperties: true
    CpuLimitFactor:
      type: number
      format: float
      minimum: 1
      maximum: 100
      description: The value used to multiply cpu requests to get the limit. If unset there will be no cpu limits.
    RemoveCpuLimitFactor:
      type: number
      minimum: 0
      maximum: 0
      description: Indicates that the cpu limits should not be set and if a limit is set it should be removed
      format: float
  responses:
    Error:
      description: The schema for all 4xx and 5xx responses
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
