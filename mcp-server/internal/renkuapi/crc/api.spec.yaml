            "application/json":
              schema:
                $ref: "#/components/schemas/QuotaWithId"
        "404":
          description: The resource pool does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - quota
  /users/{user_id}/resource_pools:
    get:
      summary: Get all resource pools that the user has access to
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          description: Filter for resource classes based on the provided name as a prefix. Omitting this parameter returns all classes.
          name: user_resource_params
          style: form
          explode: true
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                $ref: "#/components/schemas/Name"
      responses:
        "200":
          description: The resource pools that the user has access to
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolsWithId"
        "404":
          description: The user does not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - users
    post:
      summary: Give the user access to the specified resource pools
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        description: List of resource pool IDs
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/IntegerIds"
      responses:
        "201":
          description: The resource pools that the user has been given access to
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolsWithId"
        "404":
          description: The user or resource pool(s) do not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - users
    put:
      summary: Set the list of resource pools that the user has access to
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        description: List of resource pool IDs
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/IntegerIds"
      responses:
        "200":
          description: The resource pools that the user has been given access to
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolsWithId"
        "404":
          description: The user or resource pool(s) do not exist
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - users
  /groups/{group_slug}/resource_pools:
    get:
      summary: Get all resource pools that the group has access to
      parameters:
        - in: path
          name: group_slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The resource pools that the group has access to
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ResourcePoolsWithIdFiltered"
        "404":
          description: The group does not exist or the user does not have access to the group
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        default:
          $ref: "#/components/responses/Error"
      tags:
        - groups
  /version:
    get:
      summary: Get the version of the service
      responses:
        "200":
          description: The error
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Version"

components:
  schemas:
    Cluster:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        config_name:
          $ref: "#/components/schemas/ConfigName"
        session_protocol:
          $ref: "#/components/schemas/Protocol"
        session_host:
          $ref: "#/components/schemas/Host"
        session_port:
          $ref: "#/components/schemas/Port"
        session_path:
          type: string
        session_ingress_class_name:
          $ref: "#/components/schemas/IngressClassName"
        session_ingress_annotations:
          $ref: "#/components/schemas/IngressAnnotations"
        session_tls_secret_name:
          $ref: "#/components/schemas/TlsSecretName"
        session_storage_class:
          $ref: "#/components/schemas/StorageClassName"
        service_account_name:
          $ref: "#/components/schemas/K8sResourceName"
        session_ingress_use_default_cluster_tls_cert:
          type: boolean
          default: false
      required:
        [
          "name",
          "config_name",
          "session_protocol",
          "session_host",
          "session_port",
          "session_path",
          "session_ingress_annotations",
        ]
    ClusterPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        config_name:
          $ref: "#/components/schemas/ConfigName"
        session_protocol:
          $ref: "#/components/schemas/Protocol"
        session_host:
          $ref: "#/components/schemas/Host"
        session_port:
          $ref: "#/components/schemas/Port"
        session_path:
          type: string
        session_ingress_class_name:
          $ref: "#/components/schemas/IngressClassName"
        session_ingress_annotations:
          $ref: "#/components/schemas/IngressAnnotations"
        session_tls_secret_name:
          allOf:
            - $ref: "#/components/schemas/TlsSecretName"
            - description: 'If you want to remove the secret name pass in an empty string ""'
        session_storage_class:
          $ref: "#/components/schemas/StorageClassName"
        service_account_name:
          $ref: "#/components/schemas/K8sResourceNamePatch"
        session_ingress_use_default_cluster_tls_cert:
          type: boolean
    ClusterWithId:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        config_name:
          $ref: "#/components/schemas/ConfigName"
        id:
          $ref: "#/components/schemas/Ulid"
        session_protocol:
          $ref: "#/components/schemas/Protocol"
        session_host:
          $ref: "#/components/schemas/Host"
        session_port:
          $ref: "#/components/schemas/Port"
        session_path:
          type: string
        session_ingress_class_name:
          $ref: "#/components/schemas/IngressClassName"
        session_ingress_annotations:
          $ref: "#/components/schemas/IngressAnnotations"
        session_tls_secret_name:
          $ref: "#/components/schemas/TlsSecretName"
        session_storage_class:
          $ref: "#/components/schemas/StorageClassName"
        service_account_name:
          type: string
        session_ingress_use_default_cluster_tls_cert:
          type: boolean
      required:
        [
          "name",
          "config_name",
          "session_protocol",
          "session_host",
          "session_port",
          "session_path",
          "session_ingress_annotations",
          "id",
          "session_ingress_use_default_cluster_tls_cert",
        ]
    ClustersWithId:
      type: array
      items:
        $ref: "#/components/schemas/ClusterWithId"
    ResourceFlavorPost:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ResourceFlavorName"
        description:
          $ref: "#/components/schemas/ResourceFlavorDescription"
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        max_storage:
          $ref: "#/components/schemas/Storage"
        default_storage:
          $ref: "#/components/schemas/Storage"
      required:
        - name
        - cpu
        - memory
        - gpu
        - max_storage
        - default_storage
      example:
        name: "small"
        description: "Fits a standard node with room for the daemonset"
        cpu: 1.5
        memory: 2
        gpu: 0
        max_storage: 100
        default_storage: 10
    ResourceFlavor:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          description: The name of the resource flavor
        description:
          type: string
          description: Why a resource flavor is sized the way it is
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        max_storage:
          $ref: "#/components/schemas/Storage"
        default_storage:
          $ref: "#/components/schemas/Storage"
      required:
        - id
        - name
        - cpu
        - memory
        - gpu
        - max_storage
        - default_storage
    ResourceFlavorPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ResourceFlavorName"
        description:
          $ref: "#/components/schemas/ResourceFlavorDescription"
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        max_storage:
          $ref: "#/components/schemas/Storage"
        default_storage:
          $ref: "#/components/schemas/Storage"
      example:
        cpu: 2.0
    ResourceFlavorsList:
      type: array
      items:
        $ref: "#/components/schemas/ResourceFlavor"
      uniqueItems: true
    LinkedResourceClass:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/IntegerId"
        name:
          $ref: "#/components/schemas/Name"
        resource_pool_id:
          $ref: "#/components/schemas/IntegerId"
        resource_pool_name:
          $ref: "#/components/schemas/Name"
      required:
        - id
        - name
      example:
        id: 1
        name: "small"
        resource_pool_id: 1
        resource_pool_name: "default"
    LinkedResourceClassesList:
      type: array
      items:
        $ref: "#/components/schemas/LinkedResourceClass"
      uniqueItems: true
    ResourceClassProperties:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        default:
          $ref: "#/components/schemas/DefaultFlag"
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        max_storage:
          $ref: "#/components/schemas/Storage"
        default_storage:
          $ref: "#/components/schemas/Storage"
        tolerations:
          $ref: "#/components/schemas/K8sLabelList"
        node_affinities:
          $ref: "#/components/schemas/NodeAffinityList"
        quota_enforced:
          $ref: "#/components/schemas/QuotaEnforced"
        preemptible:
          $ref: "#/components/schemas/Preemptible"
        remote:
          $ref: "#/components/schemas/RemoteClassConfigurationFirecrest"
        resource_flavor_id:
          $ref: "#/components/schemas/ResourceFlavorIdPatch"
    ResourceClass:
      type: object
      description: A new resource class. Set `resource_flavor_id` to take cpu, memory, gpu and storage from a resource flavor, or set all of those values directly.
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        default:
          $ref: "#/components/schemas/DefaultFlag"
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        max_storage:
          $ref: "#/components/schemas/Storage"
        default_storage:
          $ref: "#/components/schemas/Storage"
        tolerations:
          $ref: "#/components/schemas/K8sLabelList"
        node_affinities:
          $ref: "#/components/schemas/NodeAffinityList"
        quota_enforced:
          allOf:
            - $ref: "#/components/schemas/QuotaEnforced"
          default: false
        preemptible:
          allOf:
            - $ref: "#/components/schemas/Preemptible"
          default: false
        remote:
          $ref: "#/components/schemas/RemoteClassConfigurationFirecrest"
        resource_flavor_id:
          $ref: "#/components/schemas/ResourceFlavorId"
      required:
        - name
        - default
      example:
        name: "resource class"
        default: false
        cpu: 1.5
        memory: 2
        gpu: 0
        max_storage: 100
        default_storage: 10
        quota_enforced: false
    ResourceClassPatch:
      allOf:
        - $ref: "#/components/schemas/ResourceClassProperties"
      example:
        name: "resource class"
        cpu: 1.5
    ResourceClassPatchWithId:
      allOf:
        - $ref: "#/components/schemas/ResourceClassProperties"
        - type: object
          properties:
            id:
              $ref: "#/components/schemas/IntegerId"
      required:
        - id
      example:
        id: 1
        max_storage: 50
    ResourceClassWithId:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        default:
          $ref: "#/components/schemas/DefaultFlag"
        cpu:
          $ref: "#/components/schemas/Cpu"
        memory:
          $ref: "#/components/schemas/Memory"
        gpu:
          $ref: "#/components/schemas/Gpu"
        max_storage:
          $ref: "#/components/schemas/Storage"
        default_storage:
          $ref: "#/components/schemas/Storage"
        tolerations:
          $ref: "#/components/schemas/K8sLabelList"
        node_affinities:
          $ref: "#/components/schemas/NodeAffinityList"
        id:
          $ref: "#/components/schemas/IntegerId"
        quota_enforced:
          allOf:
            - $ref: "#/components/schemas/QuotaEnforced"
          default: false
        preemptible:
          allOf:
            - $ref: "#/components/schemas/Preemptible"
          default: false
        remote:
          $ref: "#/components/schemas/RemoteClassConfigurationFirecrest"
        resource_flavor_id:
          $ref: "#/components/schemas/ResourceFlavorId"
      required:
        - name
        - default
        - cpu
        - memory
        - gpu
        - max_storage
        - default_storage
        - id
      example:
        name: "resource class"
        default: true
        cpu: 1.5
        memory: 2
        gpu: 0
        max_storage: 100
        default_storage: 10
        quota_enforced: false
        id: 1
    ResourceClassWithIdFiltered:
      allOf:
        - $ref: "#/components/schemas/ResourceClassWithId"
        - type: object
          properties:
            matching:
              type: boolean
            usage_hours_remaining:
              $ref: "#/components/schemas/UsageHoursRemaining"
            usage_hours_total:
              $ref: "#/components/schemas/UsageHoursTotal"
      example:
        name: "resource class"
        default: true
        cpu: 1.5
        memory: 2
        gpu: 0
        max_storage: 100
        default_storage: 10
        id: 1
        matching: true
    ResourceClasses:
      type: array
      items:
        $ref: "#/components/schemas/ResourceClass"
    ResourceClassesWithId:
      type: array
      items:
        $ref: "#/components/schemas/ResourceClassWithId"
      uniqueItems: true
      example:
        - name: "resource class 1"
          default: true
          cpu: 1.5
          memory: 2
          gpu: 0
          max_storage: 100
          default_storage: 10
          quota_enforced: true
          id: 1
        - name: "resource class 2"
          default: false
          cpu: 4.5
          memory: 10
          gpu: 2
          max_storage: 10000
          default_storage: 10
          quota_enforced: true
          id: 2
    ResourceClassesWithIdResponse:
      # Note: this needs to be separate from ResourceClassesWithId, or it doesn't get generated
      type: array
      items:
        $ref: "#/components/schemas/ResourceClassWithId"
      uniqueItems: true
      example:
        - name: "resource class 1"
          default: true
          cpu: 1.5
          memory: 2
          gpu: 0
          max_storage: 100
          default_storage: 10
          quota_enforced: true
          id: 1
        - name: "resource class 2"
          default: false
          cpu: 4.5
          memory: 10
          gpu: 2
          max_storage: 10000
          default_storage: 10
          quota_enforced: true
          id: 2
    ResourceClassesPatchWithId:
      type: array
      items:
        $ref: "#/components/schemas/ResourceClassPatchWithId"
      minItems: 1
      uniqueItems: true
      example:
        - name: "resource class 1"
          id: 1
        - cpu: 4.5
          max_storage: 10000
          id: 2
    ResourcePool:
      type: object
      additionalProperties: false
      properties:
        quota:
          $ref: "#/components/schemas/QuotaWithOptionalId"
        classes:
          $ref: "#/components/schemas/ResourceClasses"
        name:
          $ref: "#/components/schemas/Name"
        public:
          $ref: "#/components/schemas/PublicFlag"
        default:
          $ref: "#/components/schemas/DefaultFlag"
        remote:
          $ref: "#/components/schemas/RemoteConfiguration"
        idle_threshold:
          $ref: "#/components/schemas/IdleThreshold"
        hibernation_threshold:
          $ref: "#/components/schemas/HibernationThreshold"
        hibernation_warning_period:
          $ref: "#/components/schemas/HibernationWarningPeriod"
        cluster_id:
          $ref: "#/components/schemas/Ulid"
        platform:
          $ref: "#/components/schemas/RuntimePlatform"
        cpu_limit_factor:
          $ref: "#/components/schemas/CpuLimitFactor"
      required: ["classes", "name", "public", "default"]
      example:
        quota:
          cpu: 50
          memory: 250
          gpu: 10
        public: true
        default: false
        remote: false
        classes:
          - name: "resource class 1"
            cpu: 1.5
            memory: 2
            gpu: 0
            max_storage: 10
            default_storage: 2
            default: true
          - name: "resource class 2"
            cpu: 4.5
            memory: 10
            gpu: 2
            max_storage: 10
            default_storage: 2
            default: false
        name: "resource pool name"
        cluster_id: "change-me"
    ResourcePoolPatch:
      type: object
      additionalProperties: false
      properties:
        quota:
          $ref: "#/components/schemas/QuotaPatch"
        classes:
          $ref: "#/components/schemas/ResourceClassesPatchWithId"
        name:
          $ref: "#/components/schemas/Name"
        public:
          $ref: "#/components/schemas/PublicFlag"
        default:
          $ref: "#/components/schemas/DefaultFlag"
        remote:
          $ref: "#/components/schemas/RemoteConfigurationPatch"
        idle_threshold:
          $ref: "#/components/schemas/IdleThreshold"
        hibernation_threshold:
          $ref: "#/components/schemas/HibernationThreshold"
        hibernation_warning_period:
          $ref: "#/components/schemas/HibernationWarningPeriod"
        cluster_id:
          $ref: "#/components/schemas/Ulid"
        platform:
          $ref: "#/components/schemas/RuntimePlatform"
        cpu_limit_factor:
          oneOf:
            - $ref: "#/components/schemas/CpuLimitFactor"
            - $ref: "#/components/schemas/RemoveCpuLimitFactor"
      example:
        quota:
          cpu: 50
          gpu: 10
        classes:
          - name: "resource class 2"
            cpu: 4.5
            max_storage: 10000
        name: "resource pool name"
        cluster_id: "4QZ886777NTN8GHQ551GSVAXSA"
    ResourcePoolPut:
      type: object
      additionalProperties: false
      properties:
        quota:
          $ref: "#/components/schemas/QuotaWithId"
        classes:
          $ref: "#/components/schemas/ResourceClassesWithId"
        name:
          $ref: "#/components/schemas/Name"
        public:
          $ref: "#/components/schemas/PublicFlag"
        default:
          $ref: "#/components/schemas/DefaultFlag"
        remote:
          $ref: "#/components/schemas/RemoteConfiguration"
        idle_threshold:
          $ref: "#/components/schemas/IdleThreshold"
        hibernation_threshold:
          $ref: "#/components/schemas/HibernationThreshold"
        hibernation_warning_period:
          $ref: "#/components/schemas/HibernationWarningPeriod"
        cluster_id:
          $ref: "#/components/schemas/Ulid"
        platform:
          $ref: "#/components/schemas/RuntimePlatform"
