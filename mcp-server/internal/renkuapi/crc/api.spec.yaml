        - id
        - role
      properties:
        member_type:
          type: string
          enum: [user]
        id:
          $ref: "#/components/schemas/UserId"
        role:
          type: string
          enum: [viewer, prohibited]
      example:
        member_type: user
        id: "some-random-keycloak-id"
        role: viewer
    PoolMemberGroup:
      type: object
      additionalProperties: false
      required:
        - member_type
        - id
        - role
      properties:
        member_type:
          type: string
          enum: [group]
        id:
          $ref: "#/components/schemas/Ulid"
        role:
          type: string
          enum: [group_viewer]
      example:
        member_type: group
        id: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
        role: group_viewer
    PoolMemberProject:
      type: object
      additionalProperties: false
      required:
        - member_type
        - id
        - role
      properties:
        member_type:
          type: string
          enum: [project]
        id:
          $ref: "#/components/schemas/Ulid"
        role:
          type: string
          enum: [project_viewer]
      example:
        member_type: project
        id: "01ARZ3NDEKTSV4RRFFQ69G5FAW"
        role: project_viewer
    PoolMember:
      oneOf:
        - $ref: "#/components/schemas/PoolMemberUser"
        - $ref: "#/components/schemas/PoolMemberGroup"
        - $ref: "#/components/schemas/PoolMemberProject"
      discriminator:
        propertyName: member_type
        mapping:
          user: "#/components/schemas/PoolMemberUser"
          group: "#/components/schemas/PoolMemberGroup"
          project: "#/components/schemas/PoolMemberProject"
    PoolMembers:
      type: array
      items:
        $ref: "#/components/schemas/PoolMember"
      uniqueItems: true
    PoolMemberUserResponse:
