[package]
name = "renku-ssh-proxy"
version = "0.8.0"
edition = "2024"
readme = "README.md"
resolver = "3"
license = "Apache-2.0"
repository = "https://github.com/SwissDatascienceCenter/renku/renku-ssh-proxy"
keywords = ["renku", "ssh"]
build = "build.rs"

[dependencies]
clap = { version = "4.6.10", features = ["derive", "string", "env"] }
clap-verbosity-flag = "3.0.4"
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
color-eyre = "0.6.5"
env_logger = "0.11"
form_urlencoded = "1"
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
log = "0.4.35"
rand = { version = "0.10", features = ["thread_rng"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "charset",
  "http2",
  "json",
  "rustls",
] }
russh = "0.65.4"
serde = { version = "1.0.229", default-features = false, features = [
  "serde_derive",
] }
serde_json = "1.0.154"
ssh-encoding = { version = "0.3", features = ["bytes"] }
ssh-key = { version = "=0.7.0-rc.12", features = [
    "ed25519",
    "p256",
    "p384",
    "p521",
    "encryption",
    "ppk",
    "sha1",
] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
toml = "1.2.3"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
wiremock = "0.6"

[build-dependencies]
vergen-gix = { version = "10.0.4", features = [
  "build",
  "cargo",
  "rustc"
] }

[profile.release]
strip = "debuginfo"
opt-level = "z"
lto = true
