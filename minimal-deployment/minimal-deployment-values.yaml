# NOTE: Any resource requests and replica counts here are used only for development and testing purposes
# and likely will not be able to support more than 5 concurrent users.
# Therefore the resource requests, limits, replica counts here and are NOT SUITABLE FOR PRODUCTION.
---
authz:
  resources:
    limits:
      memory: 75Mi
    requests:
      cpu: 50m
      memory: 75Mi
dataService:
  dataTasks:
    resources:
      limits:
        memory: 250Mi
      requests:
        cpu: 50m
        memory: 250Mi
  k8sWatcher:
    resources:
      limits:
        memory: 200Mi
      requests:
        cpu: 20m
        memory: 200Mi
  resources:
    limits:
      memory: 750Mi
    requests:
      cpu: 50m
      memory: 750Mi
  replicaCount: 1
enableV1Services: false
gateway:
  replicaCount: 1
global:
  anonymousSessions:
    enabled: true
  renku:
    domain: <deployment-FQDN>
  useHTTPS: true
ingress:
  enabled: true
  hosts:
    - <deployment-FQDN>
  tls:
    - hosts:
        - <deployment-FQDN>
      secretName: <certificate-secret-name>
keycloakx:
  resources:
    requests:
      memory: 600Mi
    limits:
      memory: 600Mi
postgresql:
  primary:
    resources:
      limits:
        memory: 300Mi
      requests:
        memory: 300Mi
  # Use Bitnami's PostgreSQL image from Renkulab Harbor registry
  image:
    registry: harbor.renkulab.io
    repository: bitnami-mirror/postgresql
secretsStorage:
  resources:
    limits:
      memory: 500Mi
    requests:
      cpu: 50m
      memory: 500Mi
solr:
  resources:
    limits:
      memory: 400Mi
    requests:
      cpu: 50m
      memory: 400Mi
  # Use Bitnami's Solr image from Renkulab Harbor registry
  image:
    registry: harbor.renkulab.io
    repository: bitnami-mirror/solr
ui:
  client:
    resources:
      limits:
        memory: 300Mi
      requests:
        cpu: 10m
        memory: 300Mi
  server:
    resources:
      limits:
        memory: 75Mi
      requests:
        memory: 75Mi
valkey:
  # Sessions are not worth a volume in a throwaway deployment, they go away
  # with the pod. Without a save point valkey writes nothing to disk, so this
  # also turns off the snapshots that the renku defaults enable.
  dataStorage:
    enabled: false
  valkeyConfig: |-
    save ""
