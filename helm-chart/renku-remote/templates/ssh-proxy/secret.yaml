{{- if .Values.sshProxy.enabled }}
{{- $fullname := include "renku-remote.fullname" . -}}
{{- $secretName := printf "%s-ssh-proxy" $fullname }}
{{- $openSshHostKey := "" -}}
{{- if .Values.sshProxy.openSshHostKey -}}
{{- $openSshHostKey = .Values.sshProxy.openSshHostKey | b64enc | quote -}}
{{- else -}}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- if $secret -}}
{{- $openSshHostKey = index $secret.data "openSshHostKey" -}}
{{- else -}}
{{- $openSshHostKey = genPrivateKey "ed25519" | b64enc | quote -}}
{{- end -}}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: {{ template "renku-remote.name" $ }}
    {{- include "renku-remote.labels" . | nindent 4 }}
    app.kubernetes.io/component: ssh-proxy
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade,pre-rollback"
type: Opaque
data:
  # hostkey-R: the host key this proxy presents to the main Renku deployment's SSH proxy.
  openSshHostKey: {{ $openSshHostKey }}
{{- if .Values.sshProxy.authorizedKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-ssh-proxy-authorized-key
  labels:
    app: {{ template "renku-remote.name" $ }}
    {{- include "renku-remote.labels" . | nindent 4 }}
    app.kubernetes.io/component: ssh-proxy
type: Opaque
stringData:
  # authkey-R (public part only): accepted when the main proxy connects to this proxy.
  authorized_keys: {{ .Values.sshProxy.authorizedKey | quote }}
{{- end }}
{{- end }}
