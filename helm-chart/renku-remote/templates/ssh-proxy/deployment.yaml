{{- if .Values.sshProxy.enabled }}
{{- $fullname := include "renku-remote.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-ssh-proxy
  labels:
    app: {{ template "renku-remote.name" $ }}
    {{- include "renku-remote.labels" . | nindent 4 }}
    {{- include "renku-remote.sshProxySelectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.sshProxy.replicaCount }}
  strategy:
    {{- toYaml .Values.sshProxy.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "renku-remote.sshProxySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ template "renku-remote.name" $ }}
        {{- include "renku-remote.labels" . | nindent 8 }}
        {{- include "renku-remote.sshProxySelectorLabels" . | nindent 8 }}
      annotations:
      {{- with .Values.sshProxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # The proxy never calls the Kubernetes API; do not project the default
      # ServiceAccount token into this internet-facing pod.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml (mergeOverwrite (deepCopy .Values.podSecurityContext) (.Values.sshProxy.podSecurityContext | default dict)) | nindent 8 }}
      initContainers:
        {{- include "renku-remote.certificates.initContainer" . | nindent 8 }}
      containers:
        - name: ssh-proxy
          image: "{{ .Values.sshProxy.image.repository }}:{{ .Values.sshProxy.image.tag }}"
          imagePullPolicy: {{ .Values.sshProxy.image.pullPolicy }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) (.Values.sshProxy.securityContext | default dict)) | nindent 12 }}
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info,renku_ssh_proxy=debug"
            - name: RENKU_SSH_PROXY_HOST_KEY
              value: "/secrets/openSshHostKey/openSshHostKey"
            - name: RENKU_SSH_PROXY_SESSION_HOST_KEY
              value: "/secrets/sessionHostKey/hostKeyPub"
            - name: RENKU_SSH_PROXY_SESSION_AUTH_KEY
              value: "/secrets/sessionAuthKey/authKey"
            {{- if .Values.sshProxy.authorizedKey }}
            - name: RENKU_SSH_PROXY_AUTHORIZED_KEYS
              value: "/secrets/authorizedKeys/authorized_keys"
            {{- end }}
            - name: RENKU_SSH_PROXY_LISTEN
              value: "0.0.0.0:2222"
            - name: RENKU_SSH_PROXY_TARGET_PORT
              value: {{ .Values.sshProxy.target.port | quote }}
            - name: RENKU_SSH_PROXY_TARGET_USER
              value: {{ .Values.sshProxy.target.user | quote }}
            - name: VERSION
              value: {{ .Values.sshProxy.image.tag | quote }}
            - name: SENTRY_ENABLED
              value: {{ .Values.sshProxy.sentry.enabled | quote }}
            - name: SENTRY_DSN
              value: {{ .Values.sshProxy.sentry.dsn | quote }}
            - name: SENTRY_ENVIRONMENT
              value: {{ .Values.sshProxy.sentry.environment | quote }}
            - name: SENTRY_SAMPLE_RATE
              value: {{ .Values.sshProxy.sentry.sampleRate | quote }}
            - name: RENKU_SSH_PROXY_SECRET_SERVICE_URL
              value: {{ .Values.sshProxy.secretServiceUrl | quote }}
          volumeMounts:
            - mountPath: "/secrets/openSshHostKey"
              name: open-ssh-host-key
              readOnly: true
            - mountPath: "/secrets/sessionHostKey"
              name: session-host-key
              readOnly: true
            - mountPath: "/secrets/sessionAuthKey"
              name: session-auth-key
              readOnly: true
            {{- if .Values.sshProxy.authorizedKey }}
            - mountPath: "/secrets/authorizedKeys"
              name: authorized-keys
              readOnly: true
            {{- end }}
            {{- include "renku-remote.certificates.volumeMounts.system" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: ssh
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.sshProxy.resources | nindent 12 }}
    {{- with .Values.sshProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      affinity:
        {{- if .Values.sshProxy.affinity }}
        {{- toYaml .Values.sshProxy.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "renku-remote.sshProxySelectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
        {{- end }}
    {{- with .Values.sshProxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      volumes:
        - name: open-ssh-host-key
          secret:
            secretName: {{ $fullname }}-ssh-proxy
            items:
              - key: openSshHostKey
                path: openSshHostKey
        - name: session-host-key
          secret:
            secretName: {{ $fullname }}-ssh-session-host-key
            items:
              - key: hostKeyPub
                path: hostKeyPub
        - name: session-auth-key
          secret:
            secretName: {{ $fullname }}-ssh-proxy-session-auth-key
            items:
              - key: authKey
                path: authKey
        {{- if .Values.sshProxy.authorizedKey }}
        - name: authorized-keys
          secret:
            secretName: {{ $fullname }}-ssh-proxy-authorized-key
            defaultMode: 0400
        {{- end }}
        {{- include "renku-remote.certificates.volumes" . | nindent 8 }}
{{- end }}
