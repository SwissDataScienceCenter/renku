## Standalone deployment of the Renku MCP server only, pointing at a separate Renku deployment.
## NOTE: this stripped-down chart is for testing and is not meant to be merged.

nameOverride: ""
fullnameOverride: ""

ingress:
  enabled: true
  className: "" # nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production # Use null to remove this entry
  tls:
    ## Name of the TLS secret for mcpServer.domain, leave empty to disable TLS on the ingress
    secretName: ""

networkPolicies:
  ## Create a network policy allowing ingress to the MCP server from anywhere
  enabled: true

mcpServer:
  ## Public domain of this MCP server, which is served at https://<domain>/mcp
  domain: mcp.example.local
  renku:
    ## Public URL of the Renku deployment the MCP server talks to (required),
    ## its API is reached at <url>/api/data
    url: "" # https://renku.example.org
    ## Issuer of the user tokens, defaults to <url>/auth/realms/Renku
    keycloakIssuer: ""
  image:
    repository: renku/mcp-server
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  replicaCount: 1
  ## debug, info, warn or error
  logLevel: info
  ## Log the arguments of every tool call. Credentials are redacted.
  logToolArguments: false
  ## Rate limit of tool calls per user
  rateLimit:
    enabled: true
    callsPerMinute: 60
    burst: 20
  oauth:
    ## Where the signing keys of the realm are fetched from, defaults to the public
    ## Keycloak certs endpoint of the realm.
    jwksUrl: ""
    ## The aud and azp claims the tokens must carry. The Keycloak client of the remote
    ## deployment issuing them must add this audience (besides "renku"), and the remote
    ## gateway must accept tokens with this azp, which it does for renku-mcp when the
    ## remote deployment has mcpServer.enabled.
    audience: renku-mcp
    authorizedParty: renku-mcp
  ingress:
    ## Annotations added to those of `ingress.annotations` on the MCP server ingress.
    ## Tool calls that wait return after 50 s, so the proxy read timeout must be longer.
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
  ## Extra environment variables of the MCP server container
  extraEnv: []
  podAnnotations: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

podSecurityContext: {}
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
