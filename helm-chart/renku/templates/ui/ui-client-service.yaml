apiVersion: v1
kind: Service
metadata:
  name: {{ template "ui.fullname" . }}
  {{- with .Values.ui.client.prometheus.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" . }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.ui.client.service.type }}
  ports:
    - port: {{ .Values.ui.client.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
    {{- if .Values.ui.client.prometheus.enabled }}
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    app.kubernetes.io/name: ui
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- if .Values.ui.client.canary.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ template "ui.canary.fullname" . }}
  labels:
    app.kubernetes.io/name: ui-canary
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" . }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.ui.client.service.type }}
  ports:
    - port: {{ .Values.ui.client.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ui-canary
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
