{{- $namespaces := list -}}
{{ if .Values.notebooks.sessionsNamespace }}
{{- $namespaces = list .Release.Namespace .Values.notebooks.sessionsNamespace | uniq -}}
{{ else }}
{{- $namespaces = list .Release.Namespace -}}
{{ end }}
{{ range $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "renku.fullname" $ }}-secrets-storage
  namespace: {{ . }}
  labels:
    app.kubernetes.io/name: {{ template "renku.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: secrets-storage
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" $ }}
    heritage: {{ $.Release.Service }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "renku.fullname" $ }}-secrets-storage
  labels:
    app.kubernetes.io/name: {{ template "renku.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: secrets-storage
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" $ }}
    heritage: {{ $.Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "renku.fullname" $ }}-secrets-storage
subjects:
  - kind: ServiceAccount
    name: {{ template "renku.fullname" $ }}-secrets-storage
    namespace: {{ $.Release.Namespace }}
{{ end }}
