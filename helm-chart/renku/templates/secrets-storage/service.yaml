apiVersion: v1
kind: Service
metadata:
  name: {{ template "renku.fullname" . }}-secrets-storage
  labels:
    app.kubernetes.io/name: renku-secrets-storage
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: secrets-storage
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" . }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.secretsStorage.service.type }}
  ports:
    - port: {{ .Values.secretsStorage.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ template "renku.name" . }}-secrets-storage
    app.kubernetes.io/instance: {{ .Release.Name }}
