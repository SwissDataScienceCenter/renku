{{- if and .Values.mcpServer.enabled .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "renku.fullname" . }}-mcp-server
  labels:
    app: renku-mcp-server
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
{{- range $key, $value := mergeOverwrite (deepCopy .Values.ingress.annotations) .Values.mcpServer.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
{{- end }}
spec:
{{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
{{- end }}
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
  - hosts:
    {{- range .hosts }}
    - {{ . }}
    {{- end }}
    secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
  - host: {{ . }}
    http:
      paths:
      - path: /mcp
        pathType: Exact
        backend:
          service:
            name: {{ template "renku.fullname" $ }}-mcp-server
            port:
              number: {{ $.Values.mcpServer.service.port }}
      # RFC 9728 protected resource metadata of the /mcp resource. It names Keycloak as the
      # authorization server, whose metadata clients fetch from Keycloak directly.
      - path: /.well-known/oauth-protected-resource/mcp
        pathType: Exact
        backend:
          service:
            name: {{ template "renku.fullname" $ }}-mcp-server
            port:
              number: {{ $.Values.mcpServer.service.port }}
  {{- end }}
{{- end }}
