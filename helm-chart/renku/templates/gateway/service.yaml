---
apiVersion: v1
kind: Service
metadata:
  name: {{ template "renku.fullname" . }}-gateway
  labels:
    app: {{ template "gateway.name" . }}
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ template "gateway.name" . }}
    release: {{ .Release.Name }}

