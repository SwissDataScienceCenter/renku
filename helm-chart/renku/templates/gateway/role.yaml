apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "renku.fullname" . }}-gateway
  labels:
    app.kubernetes.io/name: {{ template "renku.name" . }}
    {{- include "gateway.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - "discovery.k8s.io"
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
