---
{{- $sshProxyClientSecret := .Values.sshProxy.keycloak.clientSecret | default (randAlphaNum 64) | b64enc | quote }}
{{- $renkuFullname := include "renku.fullname" . -}}
{{- $secretName := cat $renkuFullname "-ssh-proxy-keycloak" | nospace }}

{{- if not .Values.sshProxy.keycloak.clientSecret -}}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- if $secret }}
{{- $sshProxyClientSecret = index $secret.data "sshProxyClientSecret" }}
{{- end -}}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app: {{ template "renku.name" . }}
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade,pre-rollback"
type: Opaque
data:
  # A secret for the "ssh-proxy" OIDC client in Keycloak
  sshProxyClientSecret: {{ $sshProxyClientSecret }}
