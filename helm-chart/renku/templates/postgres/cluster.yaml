{{- if .Values.cnpg.install }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "renku.pgCluster" . }}
  labels:
    app: renku-postgres
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  instances: {{ .Values.cnpg.instances }}
  # The setup jobs create the renku, authz and keycloak db and their
  # owners as superuser (prevents cnpg from deleting the superuser secret).
  enableSuperuserAccess: true
  storage:
    size: {{ .Values.cnpg.storage.size }}
    {{- if not (empty .Values.cnpg.storage.storageClass) }}
    storageClass: {{ .Values.cnpg.storage.storageClass }}
    {{- end }}
  {{- with .Values.cnpg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.cnpg.autoMigration }}
  # Copies databases and roles from the legacy bitnami instance on initialization.
  bootstrap:
    # only runs at creation!
    initdb:
      import:
        # Monolith keeps ownership and privileges.
        type: monolith 
        databases:
          - "*"
        roles:
          - "*"
        source:
          externalCluster: legacy-bitnami
  externalClusters:
    - name: legacy-bitnami
      connectionParameters:
        host: {{ .Release.Name }}-postgresql
        user: {{ .Values.postgresql.auth.username }}
        dbname: {{ .Values.postgresql.auth.database }}
        # bitnami postgres serves plaintext by default here.
        sslmode: prefer
      password:
        name: {{ .Release.Name }}-postgresql
        key: postgres-password
  {{- end }}
{{- end }}
