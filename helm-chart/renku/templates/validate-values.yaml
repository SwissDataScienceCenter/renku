{{/*
Validation of values with actionable messages on failure.
*/}}


{{/*
Keycloak checks.
*/}}

{{- if hasKey .Values "keycloakx" }}
  {{- fail "The `keycloakx` subchart has been replaced by the Keycloak Operator. Move your values under `keycloak` and remove the `keycloakx` section." }}
{{- end }}

{{- if and .Values.keycloak.install .Values.global.keycloak.url }}
  {{- fail "An external Keycloak and the renku bundled Keycloak cannot both be configured. Set keycloak.install to false, or unset global.keycloak.url." }}
{{- end }}

{{- if and (not .Values.keycloak.install) (not .Values.global.keycloak.url) }}
  {{- fail "keycloak.install is false, so renku needs global.keycloak.url, the external Keycloak the services authenticate against." }}
{{- end }}

{{/*
Postgres instance checks.
*/}}

{{- $cnpg := default dict .Values.cnpg -}}
{{- $ext := .Values.global.externalServices.postgresql -}}

{{- if hasKey .Values "postgresql" }}
  {{- fail "The bundled bitnami `postgresql` subchart has been removed. Move the data off it before upgrading (see helm-chart/utils/postgres_migrations/bitnami-to-cnpg.md), then delete the `postgresql` section from your values. Upgrading deletes its StatefulSet, Service and admin secret; its PersistentVolumeClaim is kept." }}
{{- end }}

{{- if hasKey $cnpg "autoMigration" }}
  {{- fail "cnpg.autoMigration imported the databases from the bitnami instance, which the chart no longer deploys. Remove it from your values." }}
{{- end }}

{{- if and $ext.enabled $cnpg.install }}
  {{- fail "External PostgreSQL and the renku bundled PostgreSQL cannot both be enabled. Disable either global.externalServices.postgresql.enabled or cnpg.install." }}
{{- end }}

{{- if not (or $ext.enabled $cnpg.install) }}
  {{- fail "Renku needs a PostgreSQL. Enable either global.externalServices.postgresql.enabled, pointing it at your own instance, or cnpg.install to let renku deploy one." }}
{{- end }}

{{- if and $ext.enabled $ext.password $ext.existingSecret }}
  {{- fail "global.externalServices.postgresql.password and global.externalServices.postgresql.existingSecret cannot both be set, pick one." }}
{{- end }}

{{- if and $ext.enabled (not $ext.host) }}
  {{- fail "global.externalServices.postgresql.enabled needs global.externalServices.postgresql.host, the instance the services connect to." }}
{{- end }}

{{- if and $ext.enabled (not (or $ext.password $ext.existingSecret)) }}
  {{- fail "Renku needs the PostgreSQL admin password. Set global.externalServices.postgresql.password or global.externalServices.postgresql.existingSecret." }}
{{- end }}
