{{/*
Validation of values with actionable messages on failure.
*/}}


{{/*
Postgres instance checks.
*/}}

{{- $cnpg := default dict .Values.cnpg -}}
{{- $ext := .Values.global.externalServices.postgresql -}}
{{- $legacy := (default dict .Values.postgresql).enabled -}}

{{- if and $ext.enabled $cnpg.install }}
  {{- fail "External PostgreSQL and the renku bundled PostgreSQL cannot both be enabled. Disable either global.externalServices.postgresql.enabled or cnpg.install." }}
{{- end }}

{{- if and $legacy (not (or $ext.enabled $cnpg.install)) }}
  {{- fail "The bundled bitnami postgres can no longer back renku, it is only kept as a migration source. Enable cnpg.install alongside it, or point global.externalServices.postgresql at your own instance." }}
{{- end }}

{{- if not (or $ext.enabled $cnpg.install) }}
  {{- fail "Renku needs a PostgreSQL. Enable either global.externalServices.postgresql.enabled, pointing it at your own instance, or cnpg.install to let renku deploy one." }}
{{- end }}

{{- if and $ext.enabled $ext.password $ext.existingSecret }}
  {{- fail "global.externalServices.postgresql.password and global.externalServices.postgresql.existingSecret cannot both be set, pick one." }}
{{- end }}

{{- if $cnpg.autoMigration }}
  {{- if not $legacy }}
    {{- fail "cnpg.autoMigration imports from the legacy bitnami instance, so it needs postgresql.enabled: true. Without a source there is nothing to import." }}
  {{- end }}
  {{/* Import runs as part of initdb -> happens once. Let user know instead of silently skipping migration
  */}}
  {{- if lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace (include "renku.pgCluster" .) }}
    {{- fail (printf "cnpg.autoMigration only works while the Cluster is being created, and %s already exists. Set it back to false and migrate the data by hand (helm-chart/utils/postgres_migrations/bitnami-to-cnpg.md), or delete the Cluster to import from scratch." (include "renku.pgCluster" .)) }}
  {{- end }}
{{- end }}
