apiVersion: v1
kind: Service
metadata:
  name: {{ include "renku.fullname" . }}-authz
  labels:
    app.kubernetes.io/name: renku-authz
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" . }}
    heritage: {{ .Release.Service }}
  annotations:
    {{- if and .Values.authz.metrics.enabled .Values.authz.metrics.addPrometheusAnnotations }}
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/metrics'
    prometheus.io/port: '9090'
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 8443
      targetPort: http
      protocol: TCP
      name: http
    - port: 50051
      targetPort: grpc
      protocol: TCP
      name: grpc
    {{- if .Values.authz.metrics.enabled }}
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics 
    {{- end }}
  selector:
    app.kubernetes.io/name: renku-authz
    app.kubernetes.io/instance: {{ .Release.Name }}
