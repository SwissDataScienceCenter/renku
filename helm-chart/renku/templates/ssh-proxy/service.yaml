apiVersion: v1
kind: Service
metadata:
  name: {{ template "renku.fullname" . }}-ssh-proxy
  labels:
    app: renku-ssh-proxy
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - port: {{ .Values.sshProxy.service.port }}
      targetPort: 2222
      protocol: TCP
      name: ssh
  selector:
    app: renku-ssh-proxy
    release: {{ .Release.Name }}
