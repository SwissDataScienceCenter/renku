apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "renku.fullname" . }}-ssh-proxy
  labels:
    app: renku-ssh-proxy
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  {{- if not .Values.sshProxy.autoscaling.enabled }}
  replicas: {{ .Values.sshProxy.replicaCount }}
  {{- end }}
  strategy:
    {{- toYaml .Values.sshProxy.updateStrategy | nindent 4 }}
  selector:
    matchLabels:
      app: renku-ssh-proxy
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: renku-ssh-proxy
        release: {{ .Release.Name }}
        {{ .Values.global.redis.clientLabel | toYaml | nindent 8 }}
      annotations:
      {{- with .Values.sshProxy.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      automountServiceAccountToken: {{ .Values.global.debug }}
      containers:
        - name: ssh-proxy
          image: "{{ .Values.sshProxy.image.repository }}:{{ .Values.sshProxy.image.tag }}"
          imagePullPolicy: {{ .Values.sshProxy.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: RENKU_SSH_PROXY_TARGET_HOST
              value: {{ .Values.sshProxy.targetHost | quote }}
            - name: RENKU_SSH_PROXY_TARGET_PORT
              value: {{ .Values.sshProxy.targetPort | quote }}
            - name: RENKU_SSH_PROXY_TARGET_USER
              value: {{ .Values.sshProxy.targetUser | quote }}
            - name: RENKU_SSH_PROXY_TARGET_KEY
              value: "/secrets/targetIdentity"
            - name: RENKU_SSH_PROXY_HOST_KEY
              value: "/secrets/openSshHostKey"
            - name: VERSION
              value: {{ .Values.sshProxy.image.tag | quote }}
            - name: K8S_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SENTRY_ENABLED
              value: {{ .Values.sshProxy.sentry.enabled | quote }}
            - name: SENTRY_DSN
              value: {{ .Values.sshProxy.sentry.dsn | quote }}
            - name: SENTRY_ENVIRONMENT
              value: {{ .Values.sshProxy.sentry.environment | quote }}
            - name: SENTRY_SAMPLE_RATE
              value: {{ .Values.sshProxy.sentry.sampleRate | quote }}
            - name: LOG_FORMAT_STYLE
              value: {{ .Values.logging.logFormatStyle | quote }}
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            {{- if .Values.sshProxy.localClusterSessionServiceAccount }}
            - name: LOCAL_CLUSTER_SESSION_SERVICE_ACCOUNT
              value: {{ .Values.sshProxy.localClusterSessionServiceAccount | quote }}
            {{- end }}
            {{- if .Values.sshProxy.remoteClustersKubeconfigSecretName }}
            - name: K8S_CONFIGS_ROOT
              value: "/secrets/kube_configs"
            {{- end }}
            - name: RENKU_URL
              value: {{ (include "renku.baseUrl" .) | quote }}
          volumeMounts:
            - mountPath: "/secrets/targetIdentity"
              name: targetIdentity
              readOnly: true
            - mountPath: "/secrets/openSshHostKey"
              name: openSshHostKey
              readOnly: true
            - mountPath: "/secrets/encryptionKey"
              name: encryption-key
              readOnly: true
            - mountPath: "/secrets/publicKey"
              name: secret-service-public-key
              readOnly: true
            - mountPath: "/secrets/internalSecretKey"
              name: internal-authn-key
              readOnly: true
            {{- if .Values.sshProxy.remoteClustersKubeconfigSecretName }}
            - name: remote-cluster-kubeconfigs
              mountPath: "/secrets/kube_configs"
              readOnly: true
            {{- end }}
            {{- include "certificates.volumeMounts.system" . | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 2222
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: 2222
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
          startupProbe:
            tcpSocket:
              port: 2222
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          resources:
            {{ toYaml .Values.sshProxy.resources | nindent 12 }}
    {{- with .Values.sshProxy.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.sshProxy.affinity }}
      affinity:
        {{ toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.sshProxy.tolerations }}
      tolerations:
        {{ toYaml . | nindent 8 }}
    {{- end }}
      volumes:
        - name: openSshHostKey
          secret:
            secret-name: {{ template "renku.fullname" . }}-ssh-proxy
            items:
            - key: openSshHostKey
              path: openSshHostKey
        - name: targetIdentity
          secret:
            secret-name: {{ template "renku.fullname" . }}-ssh-proxy
            items:
            - key: targetIdentity
              path: targetIdentity
        - name: server-options
          configMap:
            name: {{ template "renku.fullname" . }}-server-options
        - name: encryption-key
          secret:
            secretName: {{ template "renku.fullname" . }}-secrets-storage
            items:
            - key: encryptionKey
              path: encryptionKey
        - name: secret-service-public-key
          secret:
            secretName: {{ template "renku.fullname" . }}-secret-service-public-key
            items:
            - key: publicKey
              path: publicKey
        - name: internal-authn-key
          secret:
            secretName: {{ template "renku.fullname" . }}-internal-authn
            items:
            - key: secretKey
              path: secretKey
        {{- if .Values.sshProxy.remoteClustersKubeconfigSecretName }}
        - name: remote-cluster-kubeconfigs
          secret:
            secretName: {{ .Values.sshProxy.remoteClustersKubeconfigSecretName }}
        {{- end }}
        {{- include "certificates.volumes" . | nindent 8 }}
      serviceAccountName: {{ template "renku.fullname" . }}-ssh-proxy
