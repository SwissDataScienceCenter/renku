---
{{- $data_service_kc_client_secret := (randAlphaNum 64) | b64enc | quote }}

{{- $renku_secret := lookup "v1" "Secret" .Release.Namespace (include "renku.fullname" .) }}
{{- if and $renku_secret $renku_secret.data }}
{{- $data_service_kc_client_secret_test := index $renku_secret.data "dataServiceKeycloakClientSecret" }}
{{- if $data_service_kc_client_secret_test }}
{{- $data_service_kc_client_secret = $data_service_kc_client_secret_test }}
{{- end -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ template "renku.fullname" . }}
  labels:
    app: {{ template "renku.name" . }}
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    # If "keep" resource policy is removed the secret is deleted post upgrade see https://github.com/helm/helm/issues/8420
    "helm.sh/resource-policy": keep
    "helm.sh/hook": "pre-install,pre-upgrade,pre-rollback"
type: Opaque
data:
  dataServiceKeycloakClientSecret: {{ $data_service_kc_client_secret }}

{{- if and (eq .Values.valkey.install true) (eq .Values.valkey.createSecret true) }}
---
{{/* Valkey authenticates through ACL users, so the password lives in this
     secret under the key configured for its "default" user. */}}
{{ $redisPassword := .Values.valkey.password | default (randAlphaNum 64) | b64enc | quote }}
{{- if not .Values.valkey.password -}}
{{- $secret := (lookup "v1" "Secret" .Release.Namespace .Values.global.redis.existingSecret) }}
{{- if $secret }}
{{- $redisPassword = index $secret.data .Values.global.redis.existingSecretPasswordKey }}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.redis.existingSecret }}
  labels:
    app: {{ template "renku.name" . }}
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    # If "keep" resource policy is removed the secret is deleted post upgrade see https://github.com/helm/helm/issues/8420
    "helm.sh/resource-policy": keep
    "helm.sh/hook": "pre-install,pre-upgrade,pre-rollback"
type: Opaque
data:
  {{ .Values.global.redis.existingSecretPasswordKey }}: {{ $redisPassword }}
{{- end }}
