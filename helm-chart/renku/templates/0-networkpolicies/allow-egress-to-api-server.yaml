# Allow access to kube api server
# Add --dry-run=server when calling helm template
# otherwise, kubeapiEndpointSlice will be empty
{{- $kubeapiEndpointSlice := lookup "discovery.k8s.io/v1" "EndpointSlice" "default" "kubernetes" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-apiserver
  labels:
    {{ include "netpol.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      renku.io/kubeapi-access: "true"
  policyTypes:
    - Egress
  egress:
    {{- range $kubeapiEndpointSlice.endpoints }}
    - to:
        {{- range .addresses }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        {{- range $kubeapiEndpointSlice.ports }}
        - protocol: {{ .protocol }}
          port: {{ .port }}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-amalthea-egress-to-apiserver
  labels:
    {{ include "netpol.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-amalthea-sessions-controller-manager
  policyTypes:
    - Egress
  egress:
    {{- range $kubeapiEndpointSlice.endpoints }}
    - to:
        {{- range .addresses }}
        - ipBlock:
            cidr: {{ . }}/32
        {{- end }}
      ports:
        {{- range $kubeapiEndpointSlice.ports }}
        - protocol: {{ .protocol }}
          port: {{ .port }}
        {{- end }}
    {{- end }}
