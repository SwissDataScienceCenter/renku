{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: communicate-with-ingress-controller
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
    - Egress
  podSelector:
    matchLabels:
      renku.io/ingress-access: "true"
  ingress:
    - from:
      {{- with .Values.networkPolicies.ingressController.selector }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: http
        - protocol: TCP
          port: https
  egress:
    - to:
      {{- with .Values.networkPolicies.ingressController.selector }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: http
        - protocol: TCP
          port: https

{{- end }}
