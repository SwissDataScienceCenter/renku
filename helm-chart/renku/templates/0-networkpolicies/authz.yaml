---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-authz
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      app.kubernetes.io/name: renku-authz
      {{- include "netpol.commonSelectors" . | nindent 6 }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              renku.io/authz-access: "true"
              {{- include "netpol.commonSelectors" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
        - protocol: TCP
          port: grpc
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-to-authz
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      renku.io/authz-access: "true"
      {{- include "netpol.commonSelectors" . | nindent 6 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: renku-authz
              {{- include "netpol.commonSelectors" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: http
        - protocol: TCP
          port: grpc
