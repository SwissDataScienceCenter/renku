{{- if not .Values.global.externalServices.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-database
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "renku.pgCluster" . }}
  ingress:
    - from:
        - podSelector:
            matchLabels:
              renku.io/database-access: "true"
              {{- include "netpol.commonSelectors" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
        # 9187 is the postgres prometheus exporter
        - protocol: TCP
          port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-to-database
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      renku.io/database-access: "true"
      {{- include "netpol.commonSelectors" . | nindent 6 }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "renku.pgCluster" . }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9187
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-from-cnpg
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Ingress
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "renku.pgCluster" . }}
  ingress:
    # Operator, and peer instances when cnpg.instances > 1, must reach the pods.
    # https://cloudnative-pg.io/documentation/current/networking/
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cnpg.operatorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "renku.pgCluster" . }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-to-cnpg
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  policyTypes:
    - Egress
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "renku.pgCluster" . }}
    # Operator, and peer instances when cnpg.instances > 1, must reach the pods.
    # https://cloudnative-pg.io/documentation/current/networking/
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.cnpg.operatorNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "renku.pgCluster" . }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000
{{- end }}
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legacy-postgres-ingress
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # No renku service talks to the legacy instance any more. The one thing that
    # still has to reach it is the cnpg cluster, which reads it over the network
    # when cnpg.autoMigration imports the data.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "renku.pgCluster" . }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
