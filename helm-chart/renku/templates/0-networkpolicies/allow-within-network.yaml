apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Allow egress to get to the dev machine
  name: allow-egress-to-own-machine
  labels:
    app: {{ template "renku.name" . }}
    chart: {{ template "renku.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 172.29.21.238/32
