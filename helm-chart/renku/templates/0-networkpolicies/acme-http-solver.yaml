---
# Need for cert-manager's http solver pods
# Current configuration is AKS specific
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-all-ingress-to-acme-http-solver-from-ingress-controller
  labels:
    {{- include "netpol.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
      {{- with .Values.networkPolicies.ingressController.selector }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      ports:
        - protocol: TCP
          port: http
        - protocol: TCP
          port: https
