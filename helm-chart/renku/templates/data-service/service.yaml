apiVersion: v1
kind: Service
metadata:
  name: {{ template "renku.fullname" . }}-data-service
  labels:
    app.kubernetes.io/name: renku-data-service
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: data-services
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" . }}
    heritage: {{ .Release.Service }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/metrics'
    prometheus.io/port: '8000'
spec:
  type: {{ .Values.dataService.service.type }}
  ports:
    - port: {{ .Values.dataService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: renku-data-service
    app.kubernetes.io/instance: {{ .Release.Name }}
