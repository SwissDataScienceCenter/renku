{{ if and .Values.dataService.rbac.enableResourcePool .Values.dataService.rbac.create}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ template "renku.fullname" . }}-data-service-resource-pool
  labels:
    app.kubernetes.io/name: {{ template "renku.name" . }}
    {{- include "dataservice.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - get
      - list
      - patch
      - delete
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "renku.fullname" . }}-data-service-resource-pool
  labels:
    app.kubernetes.io/name: {{ template "renku.name" . }}
    {{- include "dataservice.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ template "renku.fullname" . }}-data-service-resource-pool
subjects:
  - kind: ServiceAccount
    name: {{ template "renku.fullname" . }}-data-service
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ template "renku.fullname" . }}-data-service-resource-pool
  labels:
    app.kubernetes.io/name: {{ template "renku.name" . }}
    {{- include "dataservice.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - "scheduling.k8s.io"
    resources:
      - priorityclasses
    verbs:
      - get
      - list
      - patch
      - delete
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ template "renku.fullname" . }}-data-service-resource-pool
  labels:
    app.kubernetes.io/name: {{ template "renku.name" . }}
    {{- include "dataservice.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ template "renku.fullname" . }}-data-service-resource-pool
subjects:
  - kind: ServiceAccount
    name: {{ template "renku.fullname" . }}-data-service
    namespace: {{ .Release.Namespace }}
{{- end -}}
