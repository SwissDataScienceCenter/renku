{{- if .Values.dataService.capacityReservation.createPriorityClass }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ printf "%s-capacity-placeholder" (include "renku.fullname" . | trunc 42 | trimSuffix "-") }}
  labels:
    app.kubernetes.io/name: {{ template "renku.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: data-services
    app.kubernetes.io/part-of: renku
    chart: {{ template "renku.chart" . }}
    heritage: {{ .Release.Service }}
value: -1
globalDefault: false
description: "Low priority class for Renku capacity reservation placeholder pods. Evicted when user session pods need resources."
{{- end }}
