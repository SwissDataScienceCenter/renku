charts:
  - name: helm-chart/renku
    resetTag: latest
    imagePrefix: renku/
    repo:
      git: SwissDataScienceCenter/helm-charts
      published: https://swissdatasciencecenter.github.io/helm-charts
    paths:
      - helm-chart
      - mcp-server
    images:
      mcp-server:
        contextPath: .
        dockerfilePath: ./mcp-server/Dockerfile
        valuesPath: mcpServer.image
        buildArgs:
          VERSION: "{TAG}"
        paths:
          - mcp-server
